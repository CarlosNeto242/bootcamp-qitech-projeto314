services:
  api:
    build:
      context: .
      target: api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: ${SERVICE_NAME:-bootcamp-api}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
      
      FEE_ACCOUNT_KEY: ${FEE_ACCOUNT_KEY:-26ccf53d-7a91-41bf-acc2-09a93743f423}
      UNIVERSITY_API_URL: ${UNIVERSITY_API_URL:-http://mock:1080}
      UNIVERSITY_API_INTERNAL_TOKEN: ${UNIVERSITY_API_INTERNAL_TOKEN:-default_token}
      UNIVERSITY_API_TIMEOUT: ${UNIVERSITY_API_TIMEOUT:-5}
    volumes:
      - ./src:/app
    command: uvicorn app:app --host 0.0.0.0 --port 3000 --no-server-header --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health_check\")'"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./database/.
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: bootcamp
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp"]
      interval: 3s
      timeout: 3s
      retries: 20

  mock:
    image: mockserver/mockserver:mockserver-5.11.1
    command: -logLevel ERROR -serverPort 1080 -proxyRemotePort 1080
    ports:
      - "${MOCK_PORT:-1080}:1080"

